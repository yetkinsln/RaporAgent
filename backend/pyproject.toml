[build-system]
requires = ["setuptools>=75.8,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "rapor-agent"
version = "1.0.0"
description = "Yerel, kaynak izlenebilir adli rapor taslak uygulamasi"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.3",
  "pydantic==2.11.5",
  "jsonschema==4.24.0",
  "python-multipart==0.0.20",
  "PyMuPDF==1.26.1",
  "Pillow==11.2.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.5", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
